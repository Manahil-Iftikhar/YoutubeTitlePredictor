<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}YouTube Metadata Explorer{% endblock %}</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17263d;font:16px/1.6 system-ui,sans-serif}main{max-width:880px;margin:64px auto;padding:0 24px}header{margin-bottom:32px}.eyebrow{color:#087b78;font-weight:700;letter-spacing:.1em;font-size:12px;text-transform:uppercase}h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:12px 0}h2{font-size:20px}a{color:#075c8e}section,article{padding:24px;border:1px solid #dbe3ec;border-radius:16px;background:white;margin:20px 0}label{display:block;font-weight:600}input{width:100%;font:inherit;padding:12px;border:1px solid #7b8fa7;border-radius:8px}button{font:inherit;font-weight:600;background:#12314d;color:white;border:0;border-radius:8px;padding:12px 24px;cursor:pointer}.errorlist{color:#9b2434;padding-left:20px}footer,.muted{color:#52657b;font-size:14px}.description{overflow-wrap:anywhere}a:focus,button:focus,input:focus{outline:3px solid #0b9791;outline-offset:3px}
</style></head><body><main><header><span class="eyebrow">Python · Django · YouTube Data API</span><h1>YouTube Metadata Explorer</h1><p>Explore published videos related to a topic or title.</p></header>{% block content %}{% endblock %}<footer>Research prototype by Manahil Iftikhar. Results are retrieved metadata; no engagement forecast or SEO guarantee is provided.</footer></main></body></html>
