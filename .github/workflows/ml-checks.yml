name: Offline ML checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - name: Install experiment dependencies
        run: python -m pip install -r requirements-ml.txt
      - name: Test data preparation and reproducibility
        run: python -m unittest discover -s experiments -p 'test_*.py'
      - name: Run existing-data baseline
        run: python experiments/engagement_baseline.py --output reports/ci-engagement
      - name: Save measured results
        uses: actions/upload-artifact@v4
        with:
          name: offline-engagement-results
          path: reports/ci-engagement/
          if-no-files-found: error
          retention-days: 14
